<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avito AI Genius — Генератор объявлений для Авито</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #00aaff;
      --accent-hover: #0095e0;
      --border: #e5e7eb;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 640px; margin: 0 auto; }

    .header {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .header h1 { font-size: 21px; margin: 0; }
    .badge {
      background: #e0f4ff; color: #0077b6; padding: 7px 12px;
      border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: none;
    }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }

    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #f1f5f9; padding: 5px; border-radius: 12px; margin-bottom: 16px;
    }
    .mode-btn {
      padding: 10px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600;
      cursor: pointer; background: transparent; color: var(--muted); transition: 0.15s;
    }
    .mode-btn.active {
      background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    input[type="file"], textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 12px; font-size: 14px; background: #fafafa;
    }
    textarea { min-height: 110px; resize: vertical; }

    .preview-wrap { margin-top: 10px; display: none; }
    .preview-wrap img {
      max-width: 220px; max-height: 220px; border-radius: 12px;
      border: 1px solid var(--border); object-fit: cover;
    }

    .status-line { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 18px; }

    .btn {
      width: 100%; margin-top: 10px; padding: 15px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-box {
      margin-top: 18px; padding: 16px; background: #f8fafc; border: 1px solid var(--border);
      border-radius: 12px; white-space: pre-wrap; font-size: 14px; line-height: 1.55; display: none;
    }
    .copy-btn {
      margin-top: 10px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; display: none;
    }
    .copied-toast {
      display: none; margin-left: 8px; padding: 5px 10px; border-radius: 8px;
      background: var(--success-bg); color: var(--success-text); font-size: 12px; font-weight: 600;
    }

    /* Экран тарифов */
    #paywall { display: none; }
    .back-link {
      background: none; border: none; color: #0077b6; font-weight: 600;
      cursor: pointer; padding: 0; margin-bottom: 12px; font-size: 14px;
    }
    .tariffs { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
    @media (min-width: 520px) { .tariffs { grid-template-columns: 1fr 1fr; } }
    .tariff-card {
      border: 1px solid var(--border); border-radius: 16px; padding: 16px; background: #fafafa;
    }
    .tariff-card.featured { border-color: var(--accent); background: #f0f9ff; }
    .price { font-size: 24px; font-weight: 800; margin: 6px 0; }
    .pay-btn {
      display: block; text-align: center; text-decoration: none; margin-top: 12px;
      padding: 12px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Avito AI Genius</h1>
      <button class="badge" id="limitBadge" onclick="togglePaywall(true)">Тарифы</button>
    </div>

    <!-- Основной экран генерации объявления -->
    <div id="generatorCard" class="card">
      <div class="mode-switch">
        <button type="button" class="mode-btn active" id="modeGoods" onclick="setMode('goods')">Продать товар</button>
        <button type="button" class="mode-btn" id="modeService" onclick="setMode('service')">Упаковать услугу</button>
      </div>

      <label for="photoInput" id="photoLabel">Фото товара (можно без фото)</label>
      <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoPreview()" />
      <div id="previewWrap" class="preview-wrap">
        <img id="previewImg" alt="Превью фото" />
      </div>

      <label for="descInput" id="descLabel">Кратко опишите товар, состояние и цену</label>
      <textarea id="descInput" placeholder="Например: Перфоратор Bosch GBH 2-26, б/у полгода, в кейсе, работает без нареканий, хочу 5500 руб."></textarea>

      <div id="statusLine" class="status-line"></div>
      <button type="button" class="btn" id="genBtn" onclick="generateAd()">Сделать объявление для Авито</button>

      <div id="resultBox" class="result-box"></div>
      <div>
        <button type="button" id="copyBtn" class="copy-btn" onclick="copyResult()">Скопировать объявление</button>
        <span id="copiedToast" class="copied-toast">Скопировано</span>
      </div>
    </div>

    <!-- Экран оплаты тарифов -->
    <div id="paywall" class="card">
      <button type="button" class="back-link" onclick="togglePaywall(false)">← Вернуться к генератору</button>
      <h2 style="margin:0 0 6px;">Продолжить без лимитов</h2>
      <p style="margin:0; color:var(--muted); font-size:14px;">Генерация заголовков, продающих описаний и характеристик для Авито.</p>

      <div class="tariffs">
        <div class="tariff-card">
          <div><strong>Неделя</strong></div>
          <div class="price">790 ₽</div>
          <div style="font-size:13px; color:var(--muted);">7 дней активной работы</div>
          <a class="pay-btn" href="https://yookassa.ru/" target="_blank" rel="noopener">Оплатить 790 ₽</a>
        </div>

        <div class="tariff-card featured">
          <div><strong>Месяц</strong></div>
          <div class="price">1 490 ₽</div>
          <div style="font-size:13px; color:var(--muted);">30 дней, выгодно для постоянных продаж</div>
          <a class="pay-btn" href="https://yookassa.ru/" target="_blank" rel="noopener">Оплатить 1 490 ₽</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Вставьте сюда URL вебхука из Nodul
    const NODUL_WEBHOOK_URL = "https://ВАШ_ВЕБХУК_ИЗ_NODUL";

    let mode = "goods";
    let userId = localStorage.getItem("avito_ai_user_id");
    if (!userId) {
      userId = "web_" + Math.random().toString(36).substring(2, 12);
      localStorage.setItem("avito_ai_user_id", userId);
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById("modeGoods").classList.toggle("active", mode === "goods");
      document.getElementById("modeService").classList.toggle("active", mode === "service");

      if (mode === "goods") {
        document.getElementById("photoLabel").innerText = "Фото товара (можно без фото)";
        document.getElementById("descLabel").innerText = "Кратко опишите товар, состояние и цену";
        document.getElementById("descInput").placeholder = "Например: Перфоратор Bosch GBH 2-26, б/у полгода, в кейсе, работает без нареканий, хочу 5500 руб.";
      } else {
        document.getElementById("photoLabel").innerText = "Фото примера работы или обложки (необязательно)";
        document.getElementById("descLabel").innerText = "Опишите услугу, город, сроки и преимущества";
        document.getElementById("descInput").placeholder = "Например: Ремонт квартир под ключ в СПб, опыт 8 лет, договор и гарантия, выезд на замер бесплатно.";
      }
    }

    function togglePaywall(show) {
      document.getElementById("generatorCard").style.display = show ? "none" : "block";
      document.getElementById("paywall").style.display = show ? "block" : "none";
    }

    function handlePhotoPreview() {
      const fileInput = document.getElementById("photoInput");
      const wrap = document.getElementById("previewWrap");
      const img = document.getElementById("previewImg");

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          img.src = e.target.result;
          wrap.style.display = "block";
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        wrap.style.display = "none";
        img.src = "";
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function generateAd() {
      const text = document.getElementById("descInput").value.trim();
      const fileInput = document.getElementById("photoInput");
      const btn = document.getElementById("genBtn");
      const statusLine = document.getElementById("statusLine");
      const resultBox = document.getElementById("resultBox");
      const copyBtn = document.getElementById("copyBtn");

      if (!text && fileInput.files.length === 0) {
        statusLine.innerText = "Загрузите фото или напишите описание.";
        return;
      }

      if (NODUL_WEBHOOK_URL.includes("ВАШ_ВЕБХУК_ИЗ_NODUL")) {
        statusLine.innerText = "Укажите реальный URL вебхука Nodul в коде.";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Формируем объявление...";
      resultBox.style.display = "none";
      copyBtn.style.display = "none";
      document.getElementById("copiedToast").style.display = "none";

      try {
        let imageBase64 = null;
        if (fileInput.files.length > 0) {
          statusLine.innerText = "Загружаем фото...";
          imageBase64 = await fileToBase64(fileInput.files[0]);
        } else {
          statusLine.innerText = "Отправляем данные...";
        }

        const response = await fetch(NODUL_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            source: "web",
            mode: mode,
            user_text: text,
            image_base64: imageBase64
          })
        });

        statusLine.innerText = "Пишем объявление...";
        const data = await response.json();

        if (data.paywall === true) {
          statusLine.innerText = "";
          togglePaywall(true);
          return;
        }

        if (typeof data.remaining === "number") {
          document.getElementById("limitBadge").innerText = `Осталось: ${data.remaining}`;
        }

        const adText = data.result || data.text || "";
        if (adText) {
          resultBox.innerText = adText;
          resultBox.style.display = "block";
          copyBtn.style.display = "inline-block";
          statusLine.innerText = "Готово — можно копировать и выкладывать на Авито";
        } else {
          resultBox.innerText = "Ответ получен, но текст пустой. Проверьте финальный узел ответа в Nodul.";
          resultBox.style.display = "block";
          statusLine.innerText = "";
        }
      } catch (err) {
        statusLine.innerText = "";
        resultBox.innerText = "Ошибка связи с сервером: " + err.message;
        resultBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerText = "Сделать объявление для Авито";
      }
    }

    function copyResult() {
      const text = document.getElementById("resultBox").innerText;
      navigator.clipboard.writeText(text);
      document.getElementById("copiedToast").style.display = "inline-block";
    }
  </script>
</body>
</html>
