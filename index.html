<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КарточкаPRO — подписка на генератор карточек для Авито (neroai.ru)</title>
  <meta name="description" content="КарточкаPRO на neroai.ru — умный помощник для продавцов и мастеров на Авито. 3 бесплатные генерации, полный безлимит по подписке за 490 ₽/мес." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface-soft: #eef2f9;
      --ink: #0f172a;
      --ink-muted: #475569;
      --ink-subtle: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.09);
      --accent: #0d9488;
      --accent-soft: rgba(13, 148, 136, 0.11);
      --warn-bg: #fffbeb;
      --warn-line: #fde68a;
      --warn-ink: #92400e;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 14px 34px -14px rgba(15, 23, 42, 0.11);
      --shadow-lg: 0 24px 60px -15px rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(900px 420px at 85% -5%, rgba(37, 99, 235, 0.08), transparent 60%),
        radial-gradient(700px 380px at 10% 0%, rgba(13, 148, 136, 0.07), transparent 55%),
        var(--bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      letter-spacing: -0.025em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 18px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(14px);
      background: rgba(246, 248, 252, 0.88);
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 68px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.45);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-weight: 800;
      font-size: 17px;
      line-height: 1.2;
    }

    .domain-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid rgba(37, 99, 235, 0.18);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--ink-subtle);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 14px;
      padding: 11px 16px;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(37, 99, 235, 0.65);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--line);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-muted);
      padding: 8px 12px;
    }

    .btn-ghost:hover {
      background: var(--surface-soft);
      color: var(--ink);
    }

    .header-pay-btn {
      padding: 9px 13px;
      font-size: 13px;
    }

    /* Hero */
    .hero {
      padding: 40px 0 28px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 26px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
      max-width: 100%;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(29px, 4.3vw, 46px);
      line-height: 1.13;
      font-weight: 800;
    }

    h1 span {
      color: var(--primary);
    }

    .hero-lead {
      margin: 0 0 22px;
      font-size: 16.5px;
      color: var(--ink-muted);
      max-width: 580px;
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .hero-trust {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
      font-size: 13px;
      color: var(--ink-subtle);
    }

    .hero-trust span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Subscription Card */
    .offer-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .offer-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .offer-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .price-tag {
      font-size: 34px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1;
      white-space: nowrap;
    }

    .price-period {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .price-note {
      font-size: 12.5px;
      color: var(--ink-subtle);
      margin-top: 5px;
    }

    .trial-badge {
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .feature-list {
      list-style: none;
      padding: 0;
      margin: 18px 0 20px;
      display: grid;
      gap: 11px;
      font-size: 14px;
      color: var(--ink-muted);
    }

    .feature-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Benefits Strip */
    .benefits-section {
      padding: 12px 0 26px;
    }

    .section-title-row {
      margin-bottom: 16px;
    }

    .section-title-row h2 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .section-title-row p {
      margin: 0;
      font-size: 14.5px;
      color: var(--ink-subtle);
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .benefit-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .benefit-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .benefit-card h3 {
      margin: 0 0 6px;
      font-size: 15.5px;
    }

    .benefit-card p {
      margin: 0;
      font-size: 13.5px;
      color: var(--ink-muted);
    }

    /* Main Workspace */
    .workspace {
      padding: 12px 0 46px;
    }

    .workspace-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 26px;
      box-shadow: var(--shadow-md);
    }

    .workspace-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 18px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .workspace-head h2 {
      margin: 0 0 4px;
      font-size: 23px;
    }

    .workspace-head p {
      margin: 0;
      font-size: 14px;
      color: var(--ink-subtle);
    }

    .quota-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
    }

    .quota-num {
      font-weight: 800;
      font-size: 16px;
      color: var(--primary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .generator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .field input[type="text"],
    .field input[type="email"],
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);
      padding: 11px 13px;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .upload-box {
      display: block;
      border: 1.5px dashed #cbd5e1;
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.03);
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .photo-preview-wrap {
      margin-top: 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 8px 12px;
    }

    .photo-preview-wrap.active {
      display: flex;
    }

    .photo-preview-wrap img {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .photo-meta {
      text-align: left;
      font-size: 12px;
      color: var(--ink-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .status-banner {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      display: none;
    }

    .status-banner.visible {
      display: block;
    }

    .status-banner.info {
      background: var(--primary-soft);
      color: #1e3a8a;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .status-banner.warn {
      background: var(--warn-bg);
      color: var(--warn-ink);
      border: 1px solid var(--warn-line);
    }

    .output-panel {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .output-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .output-top h3 {
      margin: 0;
      font-size: 16px;
    }

    .result-block {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      margin-bottom: 12px;
    }

    .result-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-subtle);
      margin-bottom: 6px;
    }

    .result-text {
      font-size: 14px;
      color: var(--ink);
      white-space: pre-line;
      word-break: break-word;
    }

    .output-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    /* Info Sections */
    .sections {
      padding: 8px 0 52px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .info-card h3 {
      margin: 0 0 8px;
      font-size: 16.5px;
    }

    .info-card p {
      margin: 0;
      font-size: 14px;
      color: var(--ink-muted);
    }

    /* Footer */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 30px 0;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-links button {
      background: none;
      border: none;
      padding: 0;
      color: var(--ink-muted);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer-links button:hover {
      color: var(--ink);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.54);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: #fff;
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--line);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .pay-summary {
      background: var(--surface-soft);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pay-sum-title {
      font-weight: 700;
      font-size: 14px;
    }

    .pay-sum-sub {
      font-size: 12px;
      color: var(--ink-subtle);
      margin-top: 2px;
    }

    .pay-sum-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .legal-copy {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.65;
    }

    .legal-copy h4 {
      margin: 14px 0 6px;
      color: var(--ink);
      font-size: 14px;
    }

    @media (max-width: 960px) {
      .hero-grid,
      .generator-grid,
      .info-grid {
        grid-template-columns: 1fr;
      }

      .benefits-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .nav-links {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .row-2,
      .benefits-grid {
        grid-template-columns: 1fr;
      }

      .workspace-card,
      .offer-card {
        padding: 18px;
      }

      .header-actions .btn-secondary {
        display: none;
      }

      .brand-sub {
        display: none;
      }

      .header-pay-btn {
        padding: 8px 11px;
        font-size: 12.5px;
      }

      .hero-cta-row .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="#top" class="brand">
        <div class="brand-mark" aria-hidden="true">КП</div>
        <div class="brand-text">
          <span class="brand-title">
            КарточкаPRO
            <span class="domain-pill">neroai.ru</span>
          </span>
          <span class
